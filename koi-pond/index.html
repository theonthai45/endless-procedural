<!doctype html>
<html lang="en" data-style="real">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b2624">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#0b2624">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b2624">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="A procedurally generated, interactive top-down Chinese koi pond. Tap to feed the fish.">
<title>Koi Pond 锦鲤池</title>
<link rel="stylesheet" href="pond.css">
</head>
<body>
<canvas id="pond" aria-label="Animated koi pond. Tap or click the water to feed the fish."></canvas>
<div id="hint" role="status">Tap the water to feed the koi</div>

<button class="seal" id="seal" aria-label="Pond settings" aria-expanded="false" aria-controls="panel" title="Pond settings">锦鲤</button>

<section id="panel" aria-label="Pond controls">
  <div class="head">
    <div class="title"><b>锦鲤池</b><span>Koi Pond</span></div>
    <button class="x" id="close" aria-label="Close settings">×</button>
  </div>
  <div class="seg" role="group" aria-label="Art style">
    <button data-style="real" aria-pressed="false">Realistic</button>
    <button data-style="ink" aria-pressed="true">Ink wash</button>
  </div>
  <div class="rows">
    <label><span>Koi</span><output id="o-koi"></output><input type="range" id="koi" min="1" max="20" step="1"></label>
    <label><span>Small fish</span><output id="o-fish"></output><input type="range" id="fish" min="0" max="60" step="1"></label>
    <label><span>Lily pads</span><output id="o-pads"></output><input type="range" id="pads" min="0" max="30" step="1"></label>
    <label><span>Lotus flowers</span><output id="o-lotus"></output><input type="range" id="lotus" min="0" max="12" step="1"></label>
    <label><span>Petals &amp; leaves</span><output id="o-petals"></output><input type="range" id="petals" min="0" max="50" step="1"></label>
  </div>
  <label class="toggle"><input type="checkbox" id="autofeed"><span>Auto-feed (display mode)</span></label>
  <div class="sound" id="sound" role="group" aria-label="Sound">
    <div class="sh"><span>Sound</span><label class="sw" title="Sound on / off (M)"><input type="checkbox" id="snd" role="switch" aria-label="Sound on"><i></i></label></div>
    <div class="snd-body">
      <label class="ch master"><span>Master</span><output id="o-vMaster"></output><input type="range" id="vMaster" min="0" max="100" step="1" aria-label="Master volume"></label>
      <div id="snd-ch"></div>
      <p class="credit">Fountain &amp; chimes: <a href="https://bigsoundbank.com" target="_blank" rel="noopener">BigSoundBank</a> (CC0) · plops synthesised live</p>
    </div>
  </div>
  <div class="actions">
    <button id="reseed">New pond</button>
    <button id="full">Fullscreen</button>
    <button id="zen">Hide UI</button>
  </div>
  <p class="tip">Tap the water to feed · drag to scatter<span class="keys"> · keys: H hide, F fullscreen, S style, M sound</span></p>
</section>

<script type="module" src="pond.js"></script>
</body>
</html>
