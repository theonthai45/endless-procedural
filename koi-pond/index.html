<!doctype html>
<html lang="en" data-style="real">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b2624">
<meta name="description" content="A procedurally generated, interactive top-down Chinese koi pond. Tap to feed the fish.">
<title>Koi Pond 锦鲤池</title>
<style>
  :root{
    --ui-bg: rgb(10 24 24 / .58);
    --ui-fg: #eef3ee;
    --ui-dim: rgb(238 243 238 / .62);
    --ui-line: rgb(255 255 255 / .14);
    --ui-chip: rgb(255 255 255 / .08);
    --accent: #e8573a;
    color-scheme: dark;
  }
  :root[data-style="ink"]{
    --ui-bg: rgb(246 239 224 / .74);
    --ui-fg: #2a2420;
    --ui-dim: rgb(42 36 32 / .6);
    --ui-line: rgb(60 40 20 / .18);
    --ui-chip: rgb(60 40 20 / .07);
    --accent: #b8321f;
    color-scheme: light;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; overflow:hidden; background:#0b2624; overscroll-behavior:none; }
  :root[data-style="ink"] body{ background:#efe7d6; }
  body{
    font:14px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    color:var(--ui-fg); -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none;
  }
  #pond{ position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:crosshair; }

  /* panel */
  #panel{
    position:fixed; z-index:3;
    right:max(16px, env(safe-area-inset-right)); bottom:calc(max(20px, env(safe-area-inset-bottom)) + 76px);
    width:min(300px, calc(100vw - 32px)); max-height:calc(100dvh - 120px); overflow:auto;
    padding:14px 16px 12px; border-radius:18px; border:1px solid var(--ui-line);
    background:var(--ui-bg); color:var(--ui-fg);
    backdrop-filter:blur(18px) saturate(1.3); -webkit-backdrop-filter:blur(18px) saturate(1.3);
    box-shadow:0 12px 40px rgb(0 0 0 / .28);
    transform-origin:bottom right; transition:opacity .25s, transform .25s, visibility 0s;
  }
  #panel:not(.open){ opacity:0; transform:translateY(10px) scale(.97); visibility:hidden; pointer-events:none; transition:opacity .25s, transform .25s, visibility 0s .25s; }
  @media (max-width:560px){
    #panel{ left:12px; right:12px; width:auto; bottom:calc(max(16px, env(safe-area-inset-bottom)) + 72px); }
  }
  .head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .title b{ font:600 18px/1 "Songti SC","STSong","Noto Serif SC","Noto Serif CJK SC",serif; letter-spacing:.08em; margin-right:8px; }
  .title span{ color:var(--ui-dim); font-size:12px; letter-spacing:.04em; text-transform:uppercase; }
  .x{ border:0; background:none; color:var(--ui-dim); font-size:22px; line-height:1; cursor:pointer; padding:4px 6px; }
  .seg{ display:grid; grid-template-columns:1fr 1fr; gap:4px; padding:3px; border-radius:11px; background:var(--ui-chip); margin-bottom:12px; }
  .seg button{ border:0; border-radius:8px; padding:7px 0; background:none; color:var(--ui-fg); font:inherit; font-weight:500; cursor:pointer; opacity:.7; }
  .seg button[aria-pressed="true"]{ background:var(--accent); color:#fff; opacity:1; }
  .rows label{ display:grid; grid-template-columns:1fr auto; align-items:center; column-gap:8px; margin:2px 0 8px; }
  .rows output{ font-variant-numeric:tabular-nums; color:var(--ui-dim); font-size:12px; }
  .rows input{ grid-column:1 / -1; width:100%; margin:4px 0 0; accent-color:var(--accent); height:22px; }
  .toggle{ display:flex; align-items:center; gap:8px; margin:4px 0 12px; cursor:pointer; }
  .toggle input{ accent-color:var(--accent); width:16px; height:16px; }
  .actions{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
  .actions button{ border:1px solid var(--ui-line); background:var(--ui-chip); color:var(--ui-fg); font:inherit; font-size:12.5px; border-radius:9px; padding:8px 4px; cursor:pointer; }
  .actions button:hover{ border-color:var(--accent); }
  .tip{ margin:10px 0 0; color:var(--ui-dim); font-size:12px; text-align:center; }

  /* hint */
  #hint{
    position:fixed; z-index:2; left:50%; top:max(18px, env(safe-area-inset-top)); transform:translateX(-50%);
    padding:9px 16px; border-radius:999px; background:var(--ui-bg); color:var(--ui-fg); border:1px solid var(--ui-line);
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); pointer-events:none; white-space:nowrap;
    font-size:13px; letter-spacing:.02em; transition:opacity 1.2s, transform 1.2s;
  }
  #hint.gone{ opacity:0; transform:translate(-50%,-8px); }

  /* seal stamp — doubles as the controls button */
  .seal{
    position:fixed; z-index:3; right:max(20px, env(safe-area-inset-right)); bottom:max(20px, env(safe-area-inset-bottom));
    writing-mode:vertical-rl; font:600 19px/1.05 "Songti SC","STSong","Noto Serif SC","Noto Serif CJK SC",serif;
    color:#f6eadb; background:#b1301d; padding:8px 6px; border:0; border-radius:3px; letter-spacing:.06em; cursor:pointer;
    box-shadow:inset 0 0 0 2px #b1301d, inset 0 0 0 3.5px #f2dccb, 0 4px 14px rgb(0 0 0 / .25);
    transform:rotate(3deg); transition:transform .25s, opacity .5s, box-shadow .25s;
  }
  .seal::before{ content:""; position:absolute; inset:-10px; }   /* larger tap target */
  .seal:hover{ transform:rotate(3deg) scale(1.06); }
  .seal:active{ transform:rotate(3deg) scale(.96); }
  .seal[aria-expanded="true"]{ transform:rotate(0deg) scale(1.04); box-shadow:inset 0 0 0 2px #b1301d, inset 0 0 0 3.5px #f2dccb, 0 0 0 3px rgb(242 220 203 / .35), 0 4px 14px rgb(0 0 0 / .3); }
  .seal:focus-visible{ outline:2px solid #f2dccb; outline-offset:4px; }
  :root[data-style="ink"] .seal{ box-shadow:inset 0 0 0 2px #b1301d, inset 0 0 0 3.5px #f2dccb, 0 2px 6px rgb(60 30 10 / .18); }
  body.zen:not(.awake) .seal{ opacity:.55; }
  @media (max-width:560px){ .seal{ right:max(16px, env(safe-area-inset-right)); bottom:max(16px, env(safe-area-inset-bottom)); } }
  .nogl{ position:fixed; inset:0; display:grid; place-items:center; padding:24px; text-align:center; color:#eef3ee; }
  @media (pointer: coarse){ .tip .keys{ display:none; } }
  @media (prefers-reduced-motion: reduce){ #panel, #hint{ transition:none; } }
</style>

<style>
.home-link{position:fixed;z-index:2147483000;top:calc(14px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));
display:inline-flex;align-items:center;gap:6px;padding:7px 13px 8px 11px;border-radius:999px;font:500 13px/1 system-ui,-apple-system,"Segoe UI",sans-serif;
color:#fff;background:rgba(20,18,16,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);text-decoration:none;
box-shadow:0 0 0 1px rgba(255,255,255,.18);transition:opacity .4s,background .2s}
.home-link:hover{background:rgba(20,18,16,.78)}
.home-link:focus-visible{outline:2px solid #fff;outline-offset:2px}
body.zen:not(.awake) .home-link{opacity:0;pointer-events:none}
</style>
</head>
<body>
<a class="home-link" href="../index.html" aria-label="Back to all pieces"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg>All pieces</a>

<canvas id="pond" aria-label="Animated koi pond. Tap or click the water to feed the fish."></canvas>
<div id="hint" role="status">Tap the water to feed the koi</div>

<button class="seal" id="seal" aria-label="Pond settings" aria-expanded="false" aria-controls="panel" title="Pond settings">锦鲤</button>

<section id="panel" aria-label="Pond controls">
  <div class="head">
    <div class="title"><b>锦鲤池</b><span>Koi Pond</span></div>
    <button class="x" id="close" aria-label="Close settings">×</button>
  </div>
  <div class="seg" role="group" aria-label="Art style">
    <button data-style="real" aria-pressed="false">Realistic</button>
    <button data-style="ink" aria-pressed="true">Ink wash</button>
  </div>
  <div class="rows">
    <label><span>Koi</span><output id="o-koi"></output><input type="range" id="koi" min="1" max="20" step="1"></label>
    <label><span>Small fish</span><output id="o-fish"></output><input type="range" id="fish" min="0" max="60" step="1"></label>
    <label><span>Lily pads</span><output id="o-pads"></output><input type="range" id="pads" min="0" max="30" step="1"></label>
    <label><span>Lotus flowers</span><output id="o-lotus"></output><input type="range" id="lotus" min="0" max="12" step="1"></label>
    <label><span>Petals &amp; leaves</span><output id="o-petals"></output><input type="range" id="petals" min="0" max="50" step="1"></label>
  </div>
  <label class="toggle"><input type="checkbox" id="autofeed"><span>Auto-feed (display mode)</span></label>
  <div class="actions">
    <button id="reseed">New pond</button>
    <button id="full">Fullscreen</button>
    <button id="zen">Hide UI</button>
  </div>
  <p class="tip">Tap the water to feed · drag to scatter<span class="keys"> · keys: H hide, F fullscreen, S style</span></p>
</section>

<script type="module">
'use strict';
/* =====================================================================
   Koi Pond — procedural top-down koi pond.
   Rendering: WebGL2 (fish layer + surface layer FBOs, composited by a
   water shader with refraction, caustics, shadows and specular).
   All textures (koi skins, fins, lily pads, lotus, petals, food) are
   painted procedurally into a 2D canvas atlas at start-up — no external assets.
   ===================================================================== */

const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const rint = n => (Math.random() * n) | 0;
const wrapA = a => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hexRgb = h => { h = h.replace('#', ''); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; };
const rgba = (h, a) => { const [r, g, b] = hexRgb(h); return `rgba(${r},${g},${b},${a})`; };
const shade = (h, f) => '#' + hexRgb(h).map(v => Math.round(clamp(f >= 0 ? v + (255 - v) * f : v * (1 + f), 0, 255)).toString(16).padStart(2, '0')).join('');

/* ---------------- settings ---------------- */
const KEY = 'koi-pond-v1';
const small = Math.min(innerWidth, innerHeight) < 640;
const defaults = { style: 'ink', koi: small ? 5 : 8, fish: small ? 10 : 18, pads: small ? 6 : 10, lotus: small ? 2 : 4, petals: small ? 8 : 14, autofeed: false };
let S = { ...defaults };
try { Object.assign(S, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
let pondSeed = (Math.random() * 1e9) | 0;

/* ---------------- WebGL2 ---------------- */
const canvas = document.getElementById('pond');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, depth: false, stencil: false, premultipliedAlpha: false, powerPreference: 'high-performance' });
if (!gl) {
  document.body.insertAdjacentHTML('beforeend', '<div class="nogl">This koi pond needs WebGL2.<br>Please open it in a recent Chrome, Edge, Firefox or Safari.</div>');
  throw new Error('WebGL2 unavailable');
}
canvas.addEventListener('webglcontextlost', e => e.preventDefault());
canvas.addEventListener('webglcontextrestored', () => location.reload());

/* ---------------- world ---------------- */
let W = innerWidth, H = innerHeight, baseLen = 120, uScale = 1;
function computeScale() { const m = Math.min(W, H); baseLen = clamp(m * 0.19, 64, 250); uScale = clamp(m / 900, 0.45, 1.6); }
computeScale();

/* =====================================================================
   TEXTURE ATLAS (procedural painting)
   ===================================================================== */
const AT = 2048;
const atlasCv = document.createElement('canvas'); atlasCv.width = AT; atlasCv.height = AT;
const actx = atlasCv.getContext('2d');
let atlasDirty = true;
let shX = 0, shY = 0, shH = 0;
function alloc(w, h) {
  const P = 4;
  if (shX + w + P * 2 > AT) { shX = 0; shY += shH; shH = 0; }
  const r = { x: shX + P, y: shY + P, w, h };
  shX += w + P * 2; shH = Math.max(shH, h + P * 2);
  r.u0 = r.x / AT; r.v0 = r.y / AT; r.u1 = (r.x + w) / AT; r.v1 = (r.y + h) / AT;
  return r;
}
const BW = 320, BH = 100, PADX = 8, LEN = 304, HALF = 40, CY = 50;   // koi body texture
const TW = 160, TH = 120;   // tail
const PW = 80, PH = 80;     // pectoral
const DW = 160, DH = 40;    // dorsal
const MW = 64, MH = 20;     // small fish
const PAD = 256, LOT = 192, FOOD = 24, PET = 32;
const MAXKOI = 20;
const SL = { koi: [], minnow: [], pad: [], lotus: [], food: [], petal: [] };
for (let i = 0; i < MAXKOI; i++) SL.koi.push({ body: alloc(BW, BH) });
for (let i = 0; i < MAXKOI; i++) SL.koi[i].tail = alloc(TW, TH);
for (let i = 0; i < MAXKOI; i++) SL.koi[i].pec = alloc(PW, PH);
for (let i = 0; i < MAXKOI; i++) SL.koi[i].dorsal = alloc(DW, DH);
for (let i = 0; i < 6; i++) SL.pad.push(alloc(PAD, PAD));
for (let i = 0; i < 3; i++) SL.lotus.push(alloc(LOT, LOT));
for (let i = 0; i < 4; i++) SL.minnow.push(alloc(MW, MH));
for (let i = 0; i < 3; i++) SL.food.push(alloc(FOOD, FOOD));
for (let i = 0; i < 5; i++) SL.petal.push(alloc(PET, PET));

function tmp(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }
function put(slot, c) { actx.clearRect(slot.x - 3, slot.y - 3, slot.w + 6, slot.h + 6); actx.drawImage(c, slot.x, slot.y); atlasDirty = true; }

/* ---- palettes ---- */
const COL = { white: '#f3eee5', hi: '#d6361a', hi2: '#e2522a', sumi: '#1a1715', gold: '#eaa92c', plat: '#e4e3dc', asagi: '#7893a8', chagoi: '#8a6742', yellow: '#efc843', orange: '#ec7f26' };
const INKC = { white: '#fffdf8', hi: '#c2361f', hi2: '#cd4c27', sumi: '#2a2624', gold: '#d29a3c', plat: '#fcf9f2', asagi: '#8b9aa5', chagoi: '#9a7a56', yellow: '#d9b54c', orange: '#d0752f' };

/* ---- koi body silhouette (top-down) ---- */
function hwProfile(u) {
  if (u <= 0) return 0; if (u >= 1) return 0.26;
  if (u < 0.2) { const t = u / 0.2; return 0.88 * Math.pow(Math.sin(t * Math.PI / 2), 0.62); }
  if (u < 0.38) { const t = (u - 0.2) / 0.18; return 0.88 + 0.12 * (t * t * (3 - 2 * t)); }
  const t = (u - 0.38) / 0.62; return 0.26 + 0.74 * Math.pow(0.5 + 0.5 * Math.cos(Math.PI * t), 0.95);
}
const BODY_PATH = (() => {
  const p = new Path2D(), n = 72;
  for (let i = 0; i <= n; i++) { const u = i / n, x = PADX + u * LEN, y = CY - hwProfile(u) * HALF; i ? p.lineTo(x, y) : p.moveTo(x, y); }
  for (let i = n; i >= 0; i--) { const u = i / n; p.lineTo(PADX + u * LEN, CY + hwProfile(u) * HALF); }
  p.closePath(); return p;
})();
const BODY_OUTLINE = (() => {   // open outline (no line across the tail root)
  const p = new Path2D(), n = 72;
  for (const s of [-1, 1]) for (let i = 0; i <= n * 0.97; i++) { const u = i / n, x = PADX + u * LEN, y = CY + s * hwProfile(u) * HALF; i ? p.lineTo(x, y) : p.moveTo(x, y); }
  return p;
})();

/* ---- koi varieties ---- */
function stepPatches(d, color, nMin, nMax) {
  const n = nMin + rint(nMax - nMin + 1);
  let u = rnd(0.02, 0.12);
  for (let i = 0; i < n; i++) {
    const len = rnd(0.12, 0.3), u1 = Math.min(0.92, u + len);
    if (u1 - u < 0.08) break;
    const vs = rnd(0.25, 0.75), cnt = Math.max(3, Math.round((u1 - u) * 45)), circles = [];
    for (let j = 0; j < cnt; j++) circles.push({ u: rnd(u + 0.03, u1 - 0.03), v: rnd(-vs, vs), r: rnd(0.05, 0.095) });
    d.patches.push({ c: color, edge: rnd(0.7, 0.86), circles });
    u = u1 + rnd(0.04, 0.15); if (u > 0.85) break;
  }
}
function spots(d, color, n, rMin, rMax, u0 = 0.22, u1 = 0.88) {
  for (let i = 0; i < n; i++) {
    const cu = rnd(u0, u1), cv = rnd(-0.8, 0.8), circles = [], k = 2 + rint(3);
    for (let j = 0; j < k; j++) circles.push({ u: cu + rnd(-0.03, 0.03), v: cv + rnd(-0.2, 0.2), r: rnd(rMin, rMax) });
    d.patches.push({ c: color, edge: 0.76, circles });
  }
}
const VARIETIES = [
  ['Kohaku', 5, d => { d.base = 'white'; stepPatches(d, 'hi', 2, 4); }],
  ['Taisho Sanke', 3.5, d => { d.base = 'white'; stepPatches(d, 'hi', 2, 3); spots(d, 'sumi', 3 + rint(4), 0.025, 0.05); d.fin.stripes = true; }],
  ['Showa', 3, d => { d.base = 'sumi'; stepPatches(d, 'hi', 2, 3); spots(d, 'white', 2 + rint(3), 0.045, 0.085); d.fin = { c: 'white', moto: true }; }],
  ['Tancho', 1.2, d => { d.base = 'white'; d.patches.push({ c: 'hi', edge: 0.9, circles: [{ u: 0.1, v: 0, r: rnd(0.06, 0.075) }] }); }],
  ['Ogon', 1.5, d => { d.base = 'gold'; d.metallic = true; d.fin.c = 'gold'; }],
  ['Platinum Ogon', 1.2, d => { d.base = 'plat'; d.metallic = true; d.fin.c = 'plat'; }],
  ['Yamabuki', 1, d => { d.base = 'yellow'; d.metallic = true; d.fin.c = 'yellow'; }],
  ['Asagi', 1.2, d => {
    d.base = 'asagi'; d.scales = 'net'; d.fin.c = 'hi';
    for (const s of [-1, 1]) d.patches.push({ c: 'hi', edge: 0.7, circles: Array.from({ length: 9 }, () => ({ u: rnd(0.15, 0.9), v: s * rnd(0.9, 1.15), r: rnd(0.04, 0.07) })).concat([{ u: 0.08, v: s * 0.85, r: 0.05 }]) });
  }],
  ['Chagoi', 1, d => { d.base = 'chagoi'; d.scales = 'net'; d.fin.c = 'chagoi'; }],
  ['Kujaku', 1.2, d => { d.base = 'plat'; d.metallic = true; d.scales = 'net'; stepPatches(d, 'orange', 2, 3); d.fin.c = 'plat'; }],
  ['Benigoi', 0.8, d => { d.base = 'hi2'; d.fin.c = 'hi2'; }],
  ['Shiro Utsuri', 0.8, d => { d.base = 'sumi'; spots(d, 'white', 4 + rint(3), 0.06, 0.1, 0.05, 0.9); d.fin = { c: 'white', moto: true }; }],
  ['Hi Utsuri', 0.7, d => { d.base = 'sumi'; spots(d, 'hi2', 4 + rint(3), 0.06, 0.1, 0.05, 0.9); d.fin = { c: 'hi2', moto: true }; }],
  ['Kumonryu', 0.6, d => { d.base = 'sumi'; d.scales = 'doitsu'; spots(d, 'white', 5, 0.05, 0.09, 0.05, 0.9); d.fin = { c: 'white', moto: true }; }],
  ['Ochiba', 0.6, d => { d.base = 'asagi'; d.scales = 'net'; spots(d, 'chagoi', 3, 0.06, 0.09, 0.1, 0.85); d.fin.c = 'asagi'; }],
];
function makeDesc() {
  const total = VARIETIES.reduce((s, v) => s + v[1], 0);
  let r = Math.random() * total, vt = VARIETIES[0];
  for (const v of VARIETIES) { r -= v[1]; if (r <= 0) { vt = v; break; } }
  const d = { name: vt[0], base: 'white', patches: [], scales: 'normal', metallic: false, fin: { c: 'white' }, butterfly: Math.random() < 0.22, seed: (Math.random() * 1e9) | 0 };
  vt[2](d);
  if (d.scales === 'normal' && Math.random() < 0.18) d.scales = 'doitsu';
  // tail root colour follows the patch nearest the tail
  for (const p of d.patches) if (p.c !== 'white' && p.circles.some(c => c.u > 0.86)) d.fin.root = p.c;
  return d;
}

/* ---- koi painters ---- */
function drawPatches(x, d, C, ink) {
  for (const p of d.patches) {
    const col = C[p.c];
    for (const c of p.circles) {
      const cx = PADX + c.u * LEN, cy = CY + c.v * HALF, r = c.r * LEN;
      const g = x.createRadialGradient(cx, cy, 0, cx, cy, r);
      if (!ink) { g.addColorStop(0, col); g.addColorStop(p.edge, col); g.addColorStop(1, rgba(col, 0)); }
      else { g.addColorStop(0, rgba(col, 0.9)); g.addColorStop(0.55, rgba(col, 0.78)); g.addColorStop(1, rgba(col, 0)); }
      x.fillStyle = g; x.beginPath(); x.arc(cx, cy, r, 0, TAU); x.fill();
    }
    if (!ink && p.c !== 'white') {   // inner depth of colour
      for (const c of p.circles) {
        const cx = PADX + c.u * LEN, cy = CY + c.v * HALF, r = c.r * LEN * 0.6;
        const g = x.createRadialGradient(cx, cy, 0, cx, cy, r);
        g.addColorStop(0, rgba(shade(col, -0.12), 0.35)); g.addColorStop(1, rgba(shade(col, -0.12), 0));
        x.fillStyle = g; x.beginPath(); x.arc(cx, cy, r, 0, TAU); x.fill();

function quad(ax, ay, au, av, bx, by, bu, bv, cx, cy, cu, cv, dx, dy, du, dv) { V(ax, ay, au, av); V(bx, by, bu, bv); V(cx, cy, cu, cv); V(ax, ay, au, av); V(cx, cy, cu, cv); V(dx, dy, du, dv); }

function renderSpine(f, A, waveK, headAmp) {

function setDepthTint(depth) {
  if (S.style === 'ink') { tint[0] = 1; tint[1] = 1; tint[2] = 1; tint[3] = depth * 0.45; }
  else { tint[0] = 0.05; tint[1] = 0.2; tint[2] = 0.19; tint[3] = depth * 0.4; }
}
function drawKoi(k) {
  const N = k.N, L = k.L, s = k.slot, d = k.desc, sf = clamp(k.speed / (L * 1.1), 0, 1);

  // pectoral + pelvic fins

  for (const [i, lenF, base, amp, rootK] of fins) {
    const u = i / (N - 1), hwB = hwProfile(u) * HALF * kk * k.girth * rootK, nx = -ty[i], ny = tx[i];

      const c = Math.cos(th), sn = Math.sin(th) * side;

function drawMinnow(m) {

  for (let i = 0; i < m.N; i++) { SX[i] = m.rx[i]; SY[i] = m.ry[i]; SNX[i] = -m.ty[i]; SNY[i] = m.tx[i]; SHW[i] = MH / 2 * kk; STU[i] = i / (m.N - 1); }

/* ---------------- GL targets ---------------- */
const atlasTex = gl.createTexture();
function uploadAtlas() {
  gl.bindTexture(gl.TEXTURE_2D, atlasTex);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, atlasCv);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.generateMipmap(gl.TEXTURE_2D);
  atlasDirty = false;
}
function makeTarget(t, w, h) {
  if (!t) t = { tex: gl.createTexture(), fb: gl.createFramebuffer() };
  gl.bindTexture(gl.TEXTURE_2D, t.tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

/* ---------------- resize ---------------- */
function resize() {
  const oW = W, oH = H, oBase = baseLen;
  W = Math.max(1, innerWidth); H = Math.max(1, innerHeight);
  computeScale();
  applyResolution(); rip.resize();
  if (oW !== W || oH !== H) {
    const sx = W / oW, sy = H / oH, f = baseLen / oBase;
    const mv = o => { for (let i = 0; i < o.N; i++) { o.px[i] *= sx; o.py[i] *= sy; } };
    for (const k of koi) { mv(k); k.rescale(f); k.wx *= sx; k.wy *= sy; }
    for (const m of minnows) { mv(m); m.rescale(f); }
    for (const p of [...pads, ...petals, ...flowers, ...food]) { p.x *= sx; p.y *= sy; }
    for (const p of pads) { p.ax *= sx; p.ay *= sy; p.r *= f; }

/* ---------------- input ---------------- */
const hint = document.getElementById('hint');
let hintGone = false;

setTimeout(hideHint, 9000);
let down = false, lastX = 0, lastY = 0;
canvas.addEventListener('pointerdown', e => {
  down = true; try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  dropFood(e.clientX, e.clientY, 6 + rint(4)); lastX = e.clientX; lastY = e.clientY; hideHint();
});
canvas.addEventListener('pointermove', e => {
  wake();
  if (!down) return;
  if (Math.hypot(e.clientX - lastX, e.clientY - lastY) > 26) { dropFood(e.clientX, e.clientY, 2); lastX = e.clientX; lastY = e.clientY; }

canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
canvas.addEventListener('contextmenu', e => e.preventDefault());

/* ---------------- UI ---------------- */
const $ = id => document.getElementById(id);
const panel = $('panel'), seal = $('seal');
const setOpen = o => { panel.classList.toggle('open', o); seal.setAttribute('aria-expanded', o); };
seal.onclick = () => setOpen(!panel.classList.contains('open'));
$('close').onclick = () => setOpen(false);
for (const k of ['koi', 'fish', 'pads', 'lotus', 'petals']) {
  const inp = $(k), out = $('o-' + k);
  inp.value = S[k]; out.textContent = S[k];
  inp.addEventListener('input', () => { S[k] = +inp.value; out.textContent = inp.value; syncCounts(); save(); });
}
$('autofeed').checked = S.autofeed;
$('autofeed').onchange = e => { S.autofeed = e.target.checked; autoT = 2; save(); };
function setStyle(st) {
  S.style = st; document.documentElement.dataset.style = st;
  document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.style === st));
  document.querySelector('meta[name="theme-color"]').content = st === 'ink' ? '#efe7d6' : '#0b2624';
  paintStatic(); for (const k of koi) paintKoi(k); save();
}
document.querySelectorAll('.seg button').forEach(b => b.onclick = () => setStyle(b.dataset.style));
function newPond() {

  koi.length = 0; minnows.length = 0; petals.length = 0; food.length = 0; pads.length = 0; flowers.length = 0;
  paintStatic(); makePads(); makeFlowers(); syncCounts();
}
$('reseed').onclick = newPond;
const fsOk = document.fullscreenEnabled || document.webkitFullscreenEnabled;
if (!fsOk) $('full').hidden = true;
function toggleFull() {
  const el = document.documentElement;
  if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
}
$('full').onclick = toggleFull;
let wakeTimer = 0;
function wake() { if (!document.body.classList.contains('zen')) return; document.body.classList.add('awake'); clearTimeout(wakeTimer); wakeTimer = setTimeout(() => document.body.classList.remove('awake'), 2500); }

$('zen').onclick = toggleZen;
seal.addEventListener('pointerenter', wake);
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.target.type !== 'range' && e.target.type !== 'checkbox') return;
  const k = e.key.toLowerCase();
  if (k === 'h') toggleZen(); else if (k === 'f' && fsOk) toggleFull(); else if (k === 's') setStyle(S.style === 'ink' ? 'real' : 'ink');
  else if (k === 'escape') setOpen(false);

/* ---------------- boot ---------------- */
document.documentElement.dataset.style = S.style;
document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.style === S.style));
applyResolution(); rip.resize();
paintStatic(); makePads(); makeFlowers(); syncCounts();

let last = performance.now(), ripAcc = 0, avg = 1 / 60, perfT = 0;
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.1) dt = 0.1;
  time += dt;
  update(dt);
  ripAcc += dt; let st = 0;
  while (ripAcc >= 1 / 60 && st < 3) { rip.step(); ripAcc -= 1 / 60; st++; }
  if (ripAcc > 0.1) ripAcc = 0;
  render();
  // adaptive resolution
  avg = avg * 0.95 + dt * 0.05; perfT += dt;
  if (perfT > 3 && avg > 1 / 36 && quality > 0.55) { quality *= 0.85; applyResolution(); perfT = 0; }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__pond = { sim(secs) { for (let i = 0; i < secs * 60; i++) { time += 1 / 60; update(1 / 60); rip.step(); } }, koi, minnows, pads, food, dropFood, setStyle, get W() { return W; }, get H() { return H; } };
